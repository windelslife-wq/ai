name: CI

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:contracts
      # The suite asserts that a bookmarked `/app/...` path reaches the SPA shell, which
      # needs the built client: `public/app/` is generated and git-ignored, and without it
      # every deep link is a 404 by design. Build before the release gate so those
      # assertions run here instead of failing on a missing artefact.
      - run: npm ci --prefix apps/workforce-platform/client
      - run: npm run build --prefix apps/workforce-platform/client
      # On a failure, re-emit the failing test names, their failure detail, the suite
      # totals and the log tail as check ANNOTATIONS, which are readable through the API
      # without signing in to the Actions UI. Runner logs are not reachable from every
      # environment that has to debug them, and an intermittent failure with no readable
      # log invites a confident wrong diagnosis — which is what happened here before this
      # step existed (see BASELINE_TESTS.md, Phase 16).
      #
      # Writing to a file first is what makes the grep possible; it fixes nothing by
      # itself. The exit code is preserved exactly, so a failure still fails the job.
      - name: Run npm run check --workspace=@windels/workforce-platform
        run: |
          set +e
          npm run check --workspace=@windels/workforce-platform > /tmp/check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^not ok" /tmp/check.log | head -8 | while IFS= read -r line; do
              echo "::error title=failing-test::${line}"
            done
            grep -E "^\s+(error|failureType|code|location):" /tmp/check.log | head -24 | while IFS= read -r line; do
              echo "::error title=failure-detail::${line}"
            done
            grep -E "^# (tests|pass|fail)" /tmp/check.log | while IFS= read -r line; do
              echo "::error title=totals::${line}"
            done
            tail -25 /tmp/check.log | while IFS= read -r line; do
              echo "::error title=log-tail::${line}"
            done
          fi
          exit $status
      # Rebuilt for the native target below and restored for the artefact gate.
      - run: npm ci --prefix apps/workforce-platform/native
      - run: npm run check:config --prefix apps/workforce-platform/native
      - run: VITE_API_BASE_URL=https://api.example.invalid npm run build:native --prefix apps/workforce-platform/client
      - run: npm run build --prefix apps/workforce-platform/client
      # The general install gate skips an absent bundle (correct for a fresh clone);
      # a release artefact must have one, so re-run the gate with the requirement on.
      - run: node apps/workforce-platform/tools/verify-install.mjs --require-bundle
      - run: npm test --workspace=windels-football-predictions
      - run: npm ci --prefix runtime
      - run: npm --prefix runtime test

  mt5-bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r python-services/mt5-bridge/requirements.txt pytest httpx
      - run: python -m pytest python-services/mt5-bridge/test_bridge.py -q
