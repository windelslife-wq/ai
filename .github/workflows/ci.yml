name: CI

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run check --workspace=@windels/workforce-platform
      - run: npm ci --prefix apps/workforce-platform/client
      - run: npm run build --prefix apps/workforce-platform/client
      - run: npm ci --prefix apps/workforce-platform/native
      - run: npm run check:config --prefix apps/workforce-platform/native
      - run: VITE_API_BASE_URL=https://api.example.invalid npm run build:native --prefix apps/workforce-platform/client
      - run: npm run build --prefix apps/workforce-platform/client
      # The general install gate skips an absent bundle (correct for a fresh clone);
      # a release artefact must have one, so re-run the gate with the requirement on.
      - run: node apps/workforce-platform/tools/verify-install.mjs --require-bundle
      - run: npm test --workspace=windels-football-predictions
      - run: npm ci --prefix runtime
      - run: npm --prefix runtime test

  mt5-bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r python-services/mt5-bridge/requirements.txt pytest httpx
      - run: python -m pytest python-services/mt5-bridge/test_bridge.py -q
